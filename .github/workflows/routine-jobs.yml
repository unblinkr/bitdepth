name: routine jobs

# Manually dispatched, one-off. Sends five synthetic routine agent jobs (heartbeat, monitor,
# inbox digest, research briefing, ticket tagging) to one frontier model and to the cheapest
# endpoints on the route list, then commits the rows and the report to data/routine/<date>/.
# Spend is capped in code (probe/routine.py): the lower of the cap input, $5.00, and what is
# left of the nightly cap after the night's recorded run. The key is a repo secret referenced
# by name in env only.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Night to attach the run to (YYYY-MM-DD, UTC). Blank means the latest night with a run record."
        required: false
        default: ""
      baseline:
        description: "Frontier model slug for the baseline"
        required: false
        default: "anthropic/claude-sonnet-5.5"
      name:
        description: "Pass name. Blank writes data/routine/<date>; a name writes data/routine/<date>-<name>."
        required: false
        default: ""
      cap:
        description: "Spend cap in USD (never above 5.00 across passes for one date)"
        required: false
        default: "3.00"
      confirm:
        description: "Type RUN to send paid requests"
        required: true
        default: "no"

permissions:
  contents: write
  actions: read

concurrency:
  group: routine-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'RUN' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stop if the nightly is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --workflow nightly.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then
            echo "The nightly run is in progress or queued. Run this after it finishes so request concurrency stays within the limit."
            exit 1
          fi

      - name: Check the key is set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set as a repository secret. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve the date
        id: when
        env:
          IN_DATE: ${{ inputs.date }}
        run: |
          d="$IN_DATE"
          if [ -z "$d" ]; then
            d=$(ls -d data/runs/*/ | while read -r p; do [ -f "${p}run.json" ] && basename "$p"; done | sort | tail -n 1)
          fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "Run date: $d"

      - name: Estimate (sends nothing)
        env:
          RUN_DATE: ${{ steps.when.outputs.date }}
          BASELINE: ${{ inputs.baseline }}
          CAP: ${{ inputs.cap }}
          PASS_NAME: ${{ inputs.name }}
        run: python -m probe.routine --date "$RUN_DATE" --name "$PASS_NAME" --baseline "$BASELINE" --cap "$CAP" --dry-run

      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROBE_CONCURRENCY: "4"
          RUN_DATE: ${{ steps.when.outputs.date }}
          BASELINE: ${{ inputs.baseline }}
          CAP: ${{ inputs.cap }}
          PASS_NAME: ${{ inputs.name }}
        run: python -m probe.routine --date "$RUN_DATE" --name "$PASS_NAME" --source dispatch --baseline "$BASELINE" --cap "$CAP"

      - name: Report to job summary
        if: ${{ always() }}
        run: |
          latest=$(ls -t data/routine/*/report.md 2>/dev/null | head -n 1)
          if [ -n "$latest" ]; then cat "$latest" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit
        env:
          RUN_DATE: ${{ steps.when.outputs.date }}
          PASS_NAME: ${{ inputs.name }}
        run: |
          git config user.name "bitdepth-bot"
          git config user.email "bitdepth-bot@users.noreply.github.com"
          git add data/routine
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "routine: $RUN_DATE ${PASS_NAME:-pass one} (dispatch)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: routine-jobs
          path: data/routine
          if-no-files-found: ignore
