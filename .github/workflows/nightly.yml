name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
    # backup slot: GitHub skipped the 07:17 slot on 2026-10-28; run.py exits early when the date already has a run
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD, UTC). Blank means today."
        required: false
        default: ""
      selfcheck:
        description: "Also run the two-pass self-check (36 prompts, one hour apart)"
        required: false
        default: "false"

env:
  # UTC dates whose cron run includes the two-pass self-check (one-time, per date; 2026-11-14 covers the models added Nov 4 to 10). Night one (2026-10-27) ran it by dispatch on 12 prompts.
  SELFCHECK_DATES: "2026-11-02 2026-11-09 2026-11-14"
  SELFCHECK_PROMPTS: "36"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # One job per model, one after another, then one job that merges, scores and commits.
  # Seven models no longer fit one job's time limit (Nov 9 was lost to it). Jobs run in
  # sequence (max-parallel 1) so request concurrency stays at 4. Each part gets its share
  # of the nightly cap from probe.run, so the parts together stay under $7.75.
  plan:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.vars.outputs.date }}
      source: ${{ steps.vars.outputs.source }}
      selfcheck: ${{ steps.vars.outputs.selfcheck }}
      models: ${{ steps.vars.outputs.models }}
      skip: ${{ steps.vars.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve date, source, self-check and models
        id: vars
        run: |
          RUN_DATE="${{ github.event.inputs.date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(date -u +%Y-%m-%d)"; fi
          echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source=dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "source=live" >> "$GITHUB_OUTPUT"
          fi
          SELFCHECK=""
          if [ "${{ github.event.inputs.selfcheck }}" = "true" ]; then
            SELFCHECK="--selfcheck --selfcheck-prompts $SELFCHECK_PROMPTS"
          else
            for d in $SELFCHECK_DATES; do
              if [ "$d" = "$RUN_DATE" ]; then
                SELFCHECK="--selfcheck --selfcheck-prompts $SELFCHECK_PROMPTS"
              fi
            done
          fi
          echo "selfcheck=$SELFCHECK" >> "$GITHUB_OUTPUT"
          echo "models=$(python -m probe.run --date "$RUN_DATE" --list-models)" >> "$GITHUB_OUTPUT"
          if [ -f "data/runs/$RUN_DATE/run.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "run exists for $RUN_DATE, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "date $RUN_DATE selfcheck '$SELFCHECK'"

  probe:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the secret is set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set as a repository secret. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe one model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Stop starting new requests after this many minutes, so a slow part still
          # writes its run.json inside the 330-minute job limit.
          RUN_DEADLINE_MINUTES: "290"
          # 8 at once since 2026-11-10 (Mancy's call): seven models do not fit at 4.
          PROBE_CONCURRENCY: "8"
        run: |
          python -m probe.run --date "${{ needs.plan.outputs.date }}" --source "${{ needs.plan.outputs.source }}" --model "${{ matrix.model }}" ${{ needs.plan.outputs.selfcheck }}

      - name: Keep the part for the merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}
          path: data/runs/${{ needs.plan.outputs.date }}/parts/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 7

  finish:
    needs: [plan, probe]
    if: always() && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch the parts
        uses: actions/download-artifact@v4
        with:
          path: data/runs/${{ needs.plan.outputs.date }}/parts/

      - name: Merge
        run: |
          python -m probe.run --date "${{ needs.plan.outputs.date }}" --merge

      - name: Score
        run: |
          python -m probe.score --date "${{ needs.plan.outputs.date }}"

      - name: Trend
        continue-on-error: true
        run: |
          python -m probe.trend --date "${{ needs.plan.outputs.date }}"

      - name: Emit public JSON
        continue-on-error: true
        run: |
          python -m probe.emit

      - name: Watch changes and alerts
        continue-on-error: true
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WATCH_PAYMENT_LINK: ${{ secrets.WATCH_PAYMENT_LINK }}
          WATCH_TEST_PAYMENT_LINK: ${{ secrets.WATCH_TEST_PAYMENT_LINK }}
        run: |
          python -m probe.watch --notify

      # Off until the leaderboard is approved: scripts/go-live.sh creates site/.live.
      - name: Rebuild the public leaderboard
        if: hashFiles('site/.live') != ''
        continue-on-error: true
        run: |
          python -m probe.site --live

      - name: Commit results
        run: |
          git config user.name "bitdepth-bot"
          git config user.email "bitdepth-bot@users.noreply.github.com"
          git add data/runs data/scorecard data/trend data/public data/watch
          if [ -f site/.live ]; then git add site; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "probe: ${{ needs.plan.outputs.date }} (${{ needs.plan.outputs.source }})"
          git pull --rebase origin main
          git push origin HEAD:main
