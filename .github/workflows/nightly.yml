name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
    # backup slot: GitHub skipped the 07:17 slot on 2026-10-28; run.py exits early when the date already has a run
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD, UTC). Blank means today."
        required: false
        default: ""
      selfcheck:
        description: "Also run the two-pass self-check (36 prompts, one hour apart)"
        required: false
        default: "false"

env:
  # UTC dates whose cron run includes the two-pass self-check. Night one (2026-10-27) ran it by dispatch on 12 prompts.
  SELFCHECK_DATES: "2026-11-02 2026-11-09"
  SELFCHECK_PROMPTS: "36"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set as a repository secret. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve date and source
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source=dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "source=live" >> "$GITHUB_OUTPUT"
          fi
          RUN_DATE="${{ github.event.inputs.date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(date -u +%Y-%m-%d)"; fi
          SELFCHECK=""
          if [ "${{ github.event.inputs.selfcheck }}" = "true" ]; then
            SELFCHECK="--selfcheck --selfcheck-prompts $SELFCHECK_PROMPTS"
          else
            for d in $SELFCHECK_DATES; do
              if [ "$d" = "$RUN_DATE" ]; then
                SELFCHECK="--selfcheck --selfcheck-prompts $SELFCHECK_PROMPTS"
              fi
            done
          fi
          echo "selfcheck=$SELFCHECK" >> "$GITHUB_OUTPUT"
          echo "date $RUN_DATE selfcheck '$SELFCHECK'"

      - name: Probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m probe.run --date "${{ steps.vars.outputs.date }}" --source "${{ steps.vars.outputs.source }}" ${{ steps.vars.outputs.selfcheck }}

      - name: Score
        run: |
          python -m probe.score --date "${{ steps.vars.outputs.date }}"

      - name: Trend
        continue-on-error: true
        run: |
          python -m probe.trend --date "${{ steps.vars.outputs.date }}"

      - name: Emit public JSON
        continue-on-error: true
        run: |
          python -m probe.emit

      - name: Commit results
        run: |
          git config user.name "bitdepth-bot"
          git config user.email "bitdepth-bot@users.noreply.github.com"
          git add data/runs data/scorecard data/trend data/public
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "probe: ${{ steps.vars.outputs.date }} (${{ steps.vars.outputs.source }})"
          git pull --rebase origin main
          git push origin HEAD:main
