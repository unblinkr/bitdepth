name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD, UTC). Blank means today."
        required: false
        default: ""
      selfcheck:
        description: "Also run the two-pass self-check (night one only)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set as a repository secret. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve date and source
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source=dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "source=live" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event.inputs.selfcheck }}" = "true" ]; then
            echo "selfcheck=--selfcheck" >> "$GITHUB_OUTPUT"
          else
            echo "selfcheck=" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m probe.run --date "${{ steps.vars.outputs.date }}" --source "${{ steps.vars.outputs.source }}" ${{ steps.vars.outputs.selfcheck }}

      - name: Score
        run: |
          python -m probe.score --date "${{ steps.vars.outputs.date }}"

      - name: Commit results
        run: |
          git config user.name "bitdepth-bot"
          git config user.email "bitdepth-bot@users.noreply.github.com"
          git add data/runs data/scorecard
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "probe: ${{ steps.vars.outputs.date }} (${{ steps.vars.outputs.source }})"
          git pull --rebase origin main
          git push origin HEAD:main
