name: agent log savings

# Manually dispatched, one-off. Downloads public agent session logs (DataClaw exports on Hugging
# Face), groups them into jobs, and replays the final decision of the top unattended jobs on the
# cheapest endpoints on the route list. Spend is capped in code (probe/agentlogs.py): the lower of
# the cap input, $3.00, and what is left of the nightly cap after the night's recorded runs.
# Log text and model outputs stay in the artifact. Only counts and costs are committed.

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Hugging Face datasets, comma separated, each repo or repo:path"
        required: false
        default: "akenove/my-personal-codex-data:conversations.jsonl"
      stop_after:
        description: "jobs (free) or replay (paid)"
        required: false
        default: "replay"
      cap:
        description: "Spend cap in USD (never above 3.00 for one date)"
        required: false
        default: "1.00"
      confirm:
        description: "Type RUN to send paid requests"
        required: true
        default: "no"

permissions:
  contents: write
  actions: read

concurrency:
  group: agent-logs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'RUN' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stop if the nightly is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --workflow nightly.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then
            echo "The nightly run is in progress or queued. Run this after it finishes."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Download logs
        env:
          DATASETS: ${{ inputs.datasets }}
        run: |
          mkdir -p packets/agentlogs/in
          IFS=',' read -ra items <<< "$DATASETS"
          for item in "${items[@]}"; do
            item=$(echo "$item" | xargs)
            repo="${item%%:*}"
            path="conversations.jsonl"
            if [[ "$item" == *:* ]]; then path="${item#*:}"; fi
            name=$(echo "$repo" | tr '/' '_')
            curl -fsSL -o "packets/agentlogs/in/${name}.jsonl" "https://huggingface.co/datasets/${repo}/resolve/main/${path}"
          done
          ls -la packets/agentlogs/in

      - name: Jobs and estimate (sends nothing)
        run: python -m probe.agentlogs packets/agentlogs/in/*.jsonl --stop-after replay --dry-run --source dispatch

      - name: Replay
        if: ${{ inputs.stop_after == 'replay' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROBE_CONCURRENCY: "4"
          CAP: ${{ inputs.cap }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "OPENROUTER_API_KEY is not set"; exit 1; fi
          python -m probe.agentlogs packets/agentlogs/in/*.jsonl --stop-after replay --cap "$CAP" --source dispatch

      - name: Report to job summary
        if: ${{ always() }}
        run: |
          for f in packets/agentlogs/out/summary.md packets/agentlogs/out/report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Commit counts and costs
        if: ${{ inputs.stop_after == 'replay' }}
        run: |
          git config user.name "bitdepth-bot"
          git config user.email "bitdepth-bot@users.noreply.github.com"
          git add data/agentlogs || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "agentlogs: replay (dispatch)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: agent-log-savings
          path: packets/agentlogs/out
          if-no-files-found: ignore
